# Plain HTTP backend — SSL is terminated by the host nginx,
# which proxies kevin.devifyo.cloud / kevinthompsonphd.com to 127.0.0.1:8085.
# The app container runs PHP-FPM on port 9000 (FastCGI, not Octane).
server {
    listen 80;
    server_name kevinthompsonphd.com www.kevinthompsonphd.com kevin.devifyo.cloud _;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Proxy to phpMyAdmin running on port 80 in the 'phpmyadmin' container
    location /dbase/ {
        proxy_pass http://phpmyadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
